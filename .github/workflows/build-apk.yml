name: Gerar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar pasta web e Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp *.png www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Percurso Moto" "com.percurso.moto" --web-dir=www
          npx cap add android

      - name: Inserir Icones Personalizados no Android
        run: |
          # Substitui os icones padrao do Capacitor pelos arquivos PNG personalizados do repositorio
          if [ -f icon-512.png ]; then
            mkdir -p android/app/src/main/res/mipmap-xxhdpi/
            cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          elif [ -f icon-192.png ]; then
            mkdir -p android/app/src/main/res/mipmap-xxhdpi/
            cp icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          fi

      - name: Ajustar Permissoes, SDK 35 e Conflitos do Kotlin
        run: |
          # Adicionar permissoes de GPS no AndroidManifest
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>/' android/app/src/main/AndroidManifest.xml
          
          # Forcar compileSdk 35, targetSdk 35, minSdk 23 e estrategia de exclusao de conflitos Kotlin no Gradle
          echo "android { compileSdk 35; defaultConfig { targetSdk 35; minSdk 23; } }" >> android/app/build.gradle
          
          # Inserir resolucao de conflitos de dependencias kotlin no projeto raiz do android
          cat << 'EOF' >> android/build.gradle
          subprojects {
              project.configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.0'
                      }
                  }
              }
          }
          EOF

      - name: Compilar o APK (Debug Assinado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-percurso-moto-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
