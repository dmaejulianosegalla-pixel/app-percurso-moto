name: Gerar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar pasta web e Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp *.png www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Percurso Moto" "com.percurso.moto" --web-dir=www
          npx cap add android

      - name: Configurar permissoes e Build.gradle
        run: |
          # Adicionar permissoes de GPS no AndroidManifest
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>/' android/app/src/main/AndroidManifest.xml
          
          # Forçar versao compativel do SDK no Gradle se necessario
          echo "android { compileSdk 34; defaultConfig { targetSdk 34; minSdk 22; } }" >> android/app/build.gradle

      - name: Compilar o APK (Debug Assinado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-percurso-moto-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
